<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.M.F.A</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt">
        
        <!-- <header class="nav">
    
        </header> -->
        <main>
            <div class="header">
                <div class="title-section">
                    <h1 class="main">FERNANDO</h1>
                    <h3 class="surname">FERNANDEZ</h3>
                    <h3 class="surname">ARIAS</h3>
                    <div class="scroll-indicator">
                        <span class="idle-text">scroll</span>
                    </div>
                </div>
            </div>
            <div class="menu">
                <a href="#">About me</a>
                <a href="#">Projects</a>
            </div>
        </main>
    </div>

    <script>
        const scrollIndicator = document.querySelector('.scroll-indicator');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                scrollIndicator.classList.add('hidden');
            } else {
                scrollIndicator.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
